name: Herbal hourly post

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Force post even if already posted this hour"
        required: false
        default: "false"
      bot_token:
        description: "Optional BOT_TOKEN override (use secret if empty)"
        required: false
        default: ""
  schedule:
    - cron: "0,5,10,15,20,25 * * * *"
    - cron: "30,35,40,45,50,55 * * * *"

concurrency:
  group: herbal-public-once
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull state
        run: git pull --rebase origin main || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Post to Rubika channel
        env:
          BOT_TOKEN: ${{ github.event.inputs.bot_token || secrets.BOT_TOKEN }}
          CHANNEL_LINK: ${{ secrets.CHANNEL_LINK || 'https://rubika.ir/giahanedaroi' }}
          CHAT_ID: ${{ secrets.CHAT_ID || 'c0Cr7CY010ddee1b54438f20491db663' }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: python bot.py

      - name: Save state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json || true
          if git diff --staged --quiet; then
            echo "No state change"
            exit 0
          fi
          git commit -m "Update herbal anti-repeat state"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin main && break
            sleep 3
          done
